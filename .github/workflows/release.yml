name: Release
on:
  push:
    branches: [main]
    paths-ignore:
      - ".github/**"
      - "docs/**"
      - "**.md"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of a published release to post to Discord again, for example v20.5.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    if: github.repository_owner == 'orkascripts'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Next version from the conventional commits
        if: github.event_name == 'push'
        id: changelog
        uses: TriPSs/conventional-changelog-action@v5
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          preset: angular
          tag-prefix: v
          output-file: "false"
          skip-version-file: "true"
          skip-commit: "true"
          skip-on-empty: "true"
          git-push: "true"

      # An asset update is a fix(assets) commit: a patch version, like any fix. In the notes it
      # stands under "Game data" and not under "Bug Fixes". Everything else stays where it is.
      - name: Put asset updates under their own heading
        if: steps.changelog.outputs.skipped == 'false'
        env:
          NOTES: ${{ steps.changelog.outputs.clean_changelog }}
        run: |
          python3 - <<'PY'
          import os

          PREFIX = "* **assets:** "
          notes = os.environ.get("NOTES", "")
          try:
              sections = [["", []]]
              for line in notes.splitlines():
                  if line.startswith("### "):
                      sections.append([line[4:].strip(), []])
                  else:
                      sections[-1][1].append(line)
              data = []
              for title, lines in sections:
                  if title == "Bug Fixes":
                      data += ["* " + line[len(PREFIX):] for line in lines if line.startswith(PREFIX)]
                      lines[:] = [line for line in lines if not line.startswith(PREFIX)]
              if data:
                  sections.append(["Game data", data])
              parts = []
              for title, lines in sections:
                  body = "\n".join(lines).strip("\n")
                  if body.strip():
                      parts.append(("### " + title + "\n\n" if title else "") + body)
              text = "\n\n".join(parts)
          except Exception as error:  # the tag is already pushed: publish the notes as they came
              print(f"::warning::the notes were left as they are: {error}")
              text = notes
          with open("notes.md", "w", encoding="utf-8") as handle:
              handle.write(text.strip("\n") + "\n")
          PY

      - name: Publish the GitHub release
        if: steps.changelog.outputs.skipped == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.changelog.outputs.tag }}
          name: ${{ steps.changelog.outputs.tag }}
          body_path: notes.md

      # GitHub's own Discord webhook only shows the release title, so the notes are posted from here.
      - name: Post the release to Discord
        if: github.event_name == 'workflow_dispatch' || steps.changelog.outputs.skipped == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          WEBHOOK: ${{ secrets.DISCORD_UPDATES_WEBHOOK }}
          TAG: ${{ inputs.tag || steps.changelog.outputs.tag }}
          COLOR: "16776960"
        run: |
          : "${WEBHOOK:?the DISCORD_UPDATES_WEBHOOK secret is not set}"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > release.json
          author=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .commit.author.name)
          icon=$(gh api "repos/$GITHUB_REPOSITORY" --jq .owner.avatar_url)
          jq --arg repo "$GITHUB_REPOSITORY" --arg author "$author" --arg icon "$icon" --argjson color "$COLOR" '{
            embeds: [{
              author: {name: $repo, url: "https://github.com/\($repo)", icon_url: $icon},
              title: "\($repo | split("/")[1]) \(.tag_name)",
              url: .html_url,
              description: ((.body // "") | if length > 4000 then .[:4000] + "\n..." else . end),
              color: $color,
              footer: {text: "Merged by \($author)"},
              timestamp: .published_at
            }]
          }' release.json > payload.json
          curl --fail-with-body -sS --retry 3 -H "Content-Type: application/json" --data @payload.json "$WEBHOOK"
